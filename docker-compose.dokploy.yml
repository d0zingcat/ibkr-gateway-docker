services:
  ibkr-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibkr-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - dokploy-network
    environment:
      TRADING_MODE: ${IBKR_TRADING_MODE:-live}
      READ_ONLY_API: "yes"
      TWS_API_PORT: ${IBKR_TWS_PORT:-4001}
      IBKR_USERNAME: ${IBKR_USERNAME}
      IBKR_PASSWORD: ${IBKR_PASSWORD}
    volumes:
      - ibkr-gateway-settings:/home/gateway/Jts

volumes:
  ibkr-gateway-settings:

networks:
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
