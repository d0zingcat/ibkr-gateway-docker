services:
  ibkr-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibkr-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - broker-network
    environment:
      TRADING_MODE: ${IBKR_TRADING_MODE:-live}
      READ_ONLY_API: "yes"
      TWS_API_PORT: 4001
      IBKR_USERNAME: ${IBKR_USERNAME}
      IBKR_PASSWORD: ${IBKR_PASSWORD}
    volumes:
      - ibkr-gateway-settings:/home/gateway/Jts
      - goldmachine-ibkr-secrets:/run/ibkr-secrets:ro

volumes:
  ibkr-gateway-settings:
  goldmachine-ibkr-secrets:
    external: true

networks:
  broker-network:
    external: true
