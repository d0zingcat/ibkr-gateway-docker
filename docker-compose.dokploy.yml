services:
  ibkr-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibkr-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - dokploy-network
    environment:
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: ${IBKR_TRADING_MODE:-live}
      TWS_API_PORT: ${IBKR_TWS_PORT:-4001}
      READ_ONLY_API: "yes"
      TWOFA_TIMEOUT_ACTION: "restart"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      EXISTING_SESSION_DETECTED_ACTION: "primary"
    volumes:
      - ibkr-gateway-settings:/root/Jts

volumes:
  ibkr-gateway-settings:

networks:
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
