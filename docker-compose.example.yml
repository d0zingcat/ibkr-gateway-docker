services:
  ibkr-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ibkr-gateway-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: ${IBKR_TRADING_MODE:-live}
      TWS_API_PORT: 4001
      READ_ONLY_API: "yes"
      TWOFA_TIMEOUT_ACTION: "restart"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      EXISTING_SESSION_DETECTED_ACTION: "primary"
    volumes:
      - ./data/Jts:/root/Jts
